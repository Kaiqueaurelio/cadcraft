<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decode CAD — Decode Analytics</title>
  <link data-trunk rel="copy-file" href="../../assets/app-icon/decode-cad-logo.png" />
  <link data-trunk rel="rust" data-bin="cadcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    @keyframes decode-progress { from { width: 12%; transform: translateX(0); } to { width: 72%; transform: translateX(38px); } }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #22282f; }
    #cadcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #cadcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="cadcraft_canvas"></canvas>
  <div id="cadcraft_loading">
    <img src="decode-cad-logo.png" alt="Decode CAD" style="width:min(260px,55vw);height:auto;max-height:32vh;object-fit:contain;margin-bottom:28px" />
    <div style="font:600 22px system-ui,sans-serif;letter-spacing:.04em;color:#f5f7fa">Decode CAD</div>
    <div style="font:14px system-ui,sans-serif;color:#aab4c3;margin-top:10px">Initializing drawing engine…</div>
    <div style="width:180px;height:3px;background:#394452;border-radius:3px;overflow:hidden;margin-top:22px"><div style="height:100%;width:38%;background:#2f80ed;border-radius:3px;animation:decode-progress 1.4s ease-in-out infinite alternate"></div></div>
  </div>
</body>
</html>

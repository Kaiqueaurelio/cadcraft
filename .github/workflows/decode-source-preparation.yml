name: Prepare Decode Studio source packages

on:
  push:
    paths:
      - ".github/workflows/decode-source-preparation.yml"
      - "scripts/rebrand_decode_suite.py"
      - "open-source-hub/decode-suite-manifest.json"
      - "open-source-hub/assets/icons/*.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decode-source-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebrand-source:
    name: Prepare ${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - slug: photocraft
            id: decode-photo
            product: Decode Photo
          - slug: lightcraft
            id: decode-light
            product: Decode Light
          - slug: filmcraft
            id: decode-film
            product: Decode Film
          - slug: designcraft
            id: decode-design
            product: Decode Design
          - slug: vectorcraft
            id: decode-vector
            product: Decode Vector
          - slug: pdfcraft
            id: decode-pdf
            product: Decode PDF
          - slug: effectcraft
            id: decode-effects
            product: Decode Effects
          - slug: wordcraft
            id: decode-writer
            product: Decode Writer
          - slug: deckcraft
            id: decode-slides
            product: Decode Slides
          - slug: gridcraft
            id: decode-sheets
            product: Decode Sheets
          - slug: cadcraft
            id: decode-draft
            product: Decode Draft
          - slug: soundcraft
            id: decode-audio
            product: Decode Audio
          - slug: figcraft
            id: decode-ui
            product: Decode UI
    env:
      PRODUCT_ID: ${{ matrix.id }}
      UPSTREAM_SLUG: ${{ matrix.slug }}
      PRODUCT_NAME: ${{ matrix.product }}
    steps:
      - name: Checkout Decode tooling
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install icon conversion tools
        run: python -m pip install --disable-pip-version-check cairosvg Pillow

      - name: Clone the public upstream source
        run: |
          SOURCE_WORKSPACE="$RUNNER_TEMP/decode-source-workspace"
          mkdir -p "$SOURCE_WORKSPACE"
          git clone --recurse-submodules --depth 1 "https://github.com/storytold/$UPSTREAM_SLUG.git" "$SOURCE_WORKSPACE/$PRODUCT_ID"
          git -C "$SOURCE_WORKSPACE/$PRODUCT_ID" rev-parse HEAD > "$SOURCE_WORKSPACE/$PRODUCT_ID/UPSTREAM_COMMIT.txt"
          printf 'upstream=https://github.com/storytold/%s\nproduct=%s\nproduct_id=%s\n' "$UPSTREAM_SLUG" "$PRODUCT_NAME" "$PRODUCT_ID" > "$SOURCE_WORKSPACE/$PRODUCT_ID/DECODE_SOURCE_INFO.txt"

      - name: Apply Decode branding to this product only
        run: |
          SOURCE_WORKSPACE="$RUNNER_TEMP/decode-source-workspace"
          python scripts/rebrand_decode_suite.py \
            --workspace "$SOURCE_WORKSPACE" \
            --only "$PRODUCT_ID"

      - name: Validate branding and preserve required notices
        run: |
          SOURCE_WORKSPACE="$RUNNER_TEMP/decode-source-workspace"
          python - "$SOURCE_WORKSPACE/$PRODUCT_ID" "$PRODUCT_NAME" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          product = sys.argv[2]
          required = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE", "DECODE_BRANDING.md", "UPSTREAM_COMMIT.txt"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing required source/license files: {missing}")
          if product not in (root / "DECODE_BRANDING.md").read_text(encoding="utf-8"):
              raise SystemExit("Decode branding record does not contain the expected public product name")
          icon_dir = root / "assets" / "app-icon"
          if icon_dir.exists() and not any(icon_dir.rglob("*.svg")):
              raise SystemExit("The source has an icon directory but no SVG app icon after branding")
          print(f"Validated downstream branding package: {product}")
          PY

      - name: Package rebranded source tree
        run: |
          SOURCE_WORKSPACE="$RUNNER_TEMP/decode-source-workspace"
          mkdir -p artifacts
          tar --exclude='.git' --exclude='target' --exclude='node_modules' \
            -czf "artifacts/${{ matrix.id }}-source.tar.gz" -C "$SOURCE_WORKSPACE/$PRODUCT_ID" .

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-source
          path: artifacts/${{ matrix.id }}-source.tar.gz
          if-no-files-found: error
          retention-days: 30

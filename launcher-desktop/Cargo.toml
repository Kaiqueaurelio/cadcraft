[package]
name = "decode-open-source-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native, open-source application manager for the Decode Analytics Open Source Hub"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "decode-open-source-launcher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit", "persistence"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.48.1"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
semver = "1"

[workspace]
